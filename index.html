<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карта курсов · Образовательные направления</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    background: #0d0d0d;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 32px 20px 40px;
  }
  .page {
    background: #141414;
    border-radius: 14px;
    border: 0.5px solid #2a2a2a;
    padding: 28px 32px 24px;
    width: 100%;
    max-width: 1100px;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
    padding-bottom: 12px;
    border-bottom: 0.5px solid #282828;
  }
  .header h1 { font-size: 16px; font-weight: 600; color: #e8e6e0; letter-spacing: -0.01em; }
  .header span { font-size: 12px; color: #555550; }
  svg { width: 100%; display: block; overflow: visible; }
  .footer {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 0.5px solid #282828;
    font-size: 11px;
    color: #3a3a36;
    text-align: right;
  }
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <h1>Карта курсов · Образовательные направления</h1>
    <span>8 направлений &nbsp;·&nbsp; классы 1–10</span>
  </div>
  <svg id="sv" xmlns="http://www.w3.org/2000/svg"></svg>
  <div class="footer">Образовательный центр программирования и высоких технологий &nbsp;·&nbsp; ITeen Academy &nbsp;·&nbsp; Карта актуальна на 2025–2026 уч. год</div>
</div>

<script>
(function(){
  const ns='http://www.w3.org/2000/svg', sv=document.getElementById('sv');
  function mk(t,a){const e=document.createElementNS(ns,t);for(const[k,v]of Object.entries(a||{}))e.setAttribute(k,v);return e;}
  function tx(s,a){const e=mk('text',a);e.textContent=s;return e;}

  const LW=120, TH=28, RH=50, CW=80, NH=22, COLS=10, DSH=136;
  const W=LW+COLS*CW+4, dsTop=TH+RH*6, H=dsTop+DSH+RH+16;
  sv.setAttribute('viewBox',`0 0 ${W} ${H}`);

  const FONT="'Segoe UI', -apple-system, Arial, sans-serif";

  // Dark-mode palette: deeper fills, brighter strokes, light text
  const C={
    rb: {f:'#0e2d3d',s:'#3aaed8',t:'#a8dff2'},
    tm: {f:'#2e1f04',s:'#d4900a',t:'#f5cc6a'},
    pr: {f:'#2e1008',s:'#e05030',t:'#f5b09a'},
    gd: {f:'#2a2000',s:'#c0a010',t:'#f0d860'},
    en: {f:'#2a0a18',s:'#d04080',t:'#f5a8c8'},
    cs: {f:'#081a38',s:'#2880e0',t:'#90c8f8'},
    ds_a:{f:'#082038',s:'#2090c8',t:'#90d4f0'},
    ds_b:{f:'#042818',s:'#28a870',t:'#80e8b8'},
    ds_c:{f:'#102800',s:'#58b830',t:'#b0e870'},
    cd: {f:'#1e1e1c',s:'#888680',t:'#c8c6c0'},
    wb: {f:'#4a0e2a ',s:'#e91e63 ',t:'#ff80ab'},
  };

  const Y={
    rb: TH+RH*.5,   tm: TH+RH*1.5,  pr: TH+RH*2.5,
    gd: TH+RH*3.5,  en: TH+RH*4.5,  cs: TH+RH*5.5,
    ds_a: dsTop+DSH*.18,
    ds_b: dsTop+DSH*.5,
    ds_c: dsTop+DSH*.82,
    wb: dsTop+DSH+RH*.5
  };

  function gx(g){return LW+(g-0.5)*CW;}
  const NWS=72, NWD=CW*2-8, NWT=CW*3-8;

  const NODES=[
    {id:'Rb1',  g:1,   r:'rb', lb:'WeDo 1.2'},
    {id:'Rb2',  g:2,   r:'rb', lb:'WeDo 2.0'},
    {id:'Rb4',  g:4,   r:'rb', lb:'EV3. Ур.1'},
    {id:'Rb5',  g:5,   r:'rb', lb:'EV3. Ур.2'},
    {id:'Rbs67',g:6.5, r:'rb', lb:'EV3, Micro:bit, Arduino', sp:2},
    {id:'Tm3',  g:3,   r:'tm', lb:'Scr + WeDo'},
    {id:'Tm4',  g:4,   r:'tm', lb:'Microbit. Ур.1'},
    {id:'Tm5',  g:5,   r:'tm', lb:'Microbit. Ур.2'},
    {id:'Tm7',  g:7,   r:'tm', lb:'Arduino. Ур.1'},
    {id:'Tm8',  g:8,   r:'tm', lb:'Arduino. Ур.2'},
    {id:'Tm910',g:9.5, r:'tm', lb:'Arduino. Ур.3', sp:2},
    {id:'Pr34', g:3.5, r:'pr', lb:'Scratch + LM', sp:2},
    {id:'Pr5',  g:5,   r:'pr', lb:'Scratch'},
    {id:'Pt7',  g:7,   r:'pr', lb:'Python. Ур.1'},
    {id:'Pt8',  g:8,   r:'pr', lb:'Python. Ур.2'},
    {id:'Pt910',g:9.5, r:'pr', lb:'Python. Ур.3', sp:2},
    {id:'Gd3',  g:3,   r:'gd', lb:'Minecraft 1'},
    {id:'Gd4',  g:4,   r:'gd', lb:'Minecraft 2'},
    {id:'Gd5',  g:5,   r:'gd', lb:'Minecraft 3'},
    {id:'Gd6',  g:6,   r:'gd', lb:'Roblox'},
    {id:'Gd7',  g:7,   r:'gd', lb:'Unity. Ур.1'},
    {id:'Gd8',  g:8,   r:'gd', lb:'Unity. Ур.2'},
    {id:'Gd9',  g:9.5, r:'gd', lb:'Unity. Ур 3', sp:2},
    {id:'Sn3',  g:2,   r:'en', lb:'English. Stage 1', sp:3},
    {id:'En4',  g:5,   r:'en', lb:'English. Stage 2', sp:3},
    {id:'En5',  g:8,   r:'en', lb:'English. Stage 3', sp:3},
    {id:'Cs1',  g:1,   r:'cs', lb:'IT-старт'},
    {id:'NN7',  g:7,   r:'cs', lb:'AI-старт'},
    {id:'Ms3',  g:3,   r:'ds_a', lb:'МультСтарт'},
    {id:'Ms5',  g:5,   r:'ds_a', lb:'Анимация 1'},
    {id:'Mg7',  g:7,   r:'ds_a', lb:'Анимация·2'},
    {id:'Ms8',  g:8,   r:'ds_a', lb:'Motion Design'},
    {id:'Bl910',g:9.5, r:'ds_a', lb:'Blender', sp:2},
    {id:'Kg5',  g:5,   r:'ds_b', lb:'Графика 1'},
    {id:'Sm7',  g:7,   r:'ds_b', lb:'Дизайн·СММ'},
    {id:'Ui8',  g:8.5, r:'ds_b', lb:'UI/UX·8-9', sp:2},
    {id:'Di3',  g:3,   r:'ds_c', lb:'Creative Lab'},
    {id:'Di5',  g:5,   r:'ds_c', lb:'Веб-дизайн'},
    {id:'Di7',  g:7,   r:'ds_c', lb:'Графика 2'},
    {id:'Di810',g:9,   r:'ds_c', lb:'Digital-Иллюстрация', sp:3},
    {id:'Wb7',  g:7,   r:'wb', lb:'Web'},
    {id:'Wb910',g:9, r:'wb', lb:'Frontend'},
   {id:'Wb910',g:10, r:'wb', lb:'FullStack'},
  ];

  const NM={};
  NODES.forEach(n=>{
    n.x=gx(n.g); n.y=Y[n.r]; n.c=C[n.ck||n.r];
    n.w = n.sp===3 ? NWT : n.sp===2 ? NWD : NWS;
    NM[n.id]=n;
  });

  const MAIN=[
    ['Rb1','Rb2'],['Rb2','Rb4'],['Rb4','Rb5'],['Rb5','Rbs67'],
    ['Tm3','Tm4'],['Tm4','Tm5'],['Tm5','Tm7'],['Tm7','Tm8'],['Tm8','Tm910'],
    ['Pr34','Pr5'],['Pr5','Pt7'],['Pt7','Pt8'],['Pt8','Pt910'],
    ['Gd3','Gd4'],['Gd4','Gd5'],['Gd5','Gd6'],['Gd6','Gd7'],['Gd7','Gd8'],
    ['En2','En4'],['En4','En5'],['En5','En7'],['En7','En8'],
    ['Ms3','Ms5'],['Ms5','Mg7'],['Mg7','Ms8'],['Ms8','Bl910'],
    ['Kg5','Sm7'],['Sm7','Ui8'],
    ['Di3','Di5'],['Di5','Di7'],['Di7','Di810'],
    ['Wb7','Wb910'],
  ];

  const CROSS=[
    ['Cs1','Rb1'], ['Cs1','Pr34'],
    ['Rb2','Tm3'], ['Rb4','Tm4'], ['Rb5','Tm5'], ['Rb2','Pr34'], ['Rbs67','Tm7'],
    ['Pr5','Gd5'],
    ['Pt7','Wb7'],
    ['Tm8','Cd910'], ['Pt8','Cd910'],
    ['NN7','Pt7'], ['NN7','Gd7'], ['NN7','Di7'],
    ['Di3','Ms3'], ['Di5','Ms5'], ['Di5','Kg5'], ['Ms5','Kg5'],
    ['Mg7','Sm7'],
    ['Di7','Ms8'],
    ['Di810','Bl910'],
    ['Wb7','Ui8'], ['Ui8','Wb910'],
    ['Di7','Wb7'], ['Sm7','Wb7'],
  ];

  const defs=mk('defs');
  function mkA(id,col){
    const m=mk('marker',{id,markerWidth:'8',markerHeight:'8',refX:'7',refY:'4',orient:'auto',markerUnits:'userSpaceOnUse'});
    m.appendChild(mk('path',{d:'M0,0.5 L0,7.5 L7,4 z',fill:col}));
    defs.appendChild(m);
  }
  Object.entries(C).forEach(([k,v])=>mkA('am-'+k,v.s));
  mkA('am-x','rgba(180,180,200,0.45)');
  sv.appendChild(defs);

  // Background & grid
  const bg=mk('g');
  bg.appendChild(mk('rect',{x:0,y:0,width:W,height:H,fill:'#141414'}));
  for(let i=0;i<6;i+=2)
    bg.appendChild(mk('rect',{x:LW,y:TH+i*RH,width:W-LW,height:RH,fill:'rgba(255,255,255,0.018)',stroke:'none'}));
  bg.appendChild(mk('rect',{x:0,y:dsTop,width:W,height:DSH,fill:'rgba(255,255,255,0.012)',stroke:'none'}));
  for(let i=0;i<=6;i++)
    bg.appendChild(mk('line',{x1:LW,y1:TH+i*RH,x2:W,y2:TH+i*RH,stroke:'#282826','stroke-width':'0.5'}));
  [dsTop+DSH/3,dsTop+DSH*2/3].forEach(y=>
    bg.appendChild(mk('line',{x1:LW,y1:y,x2:W,y2:y,stroke:'#282826','stroke-width':'0.5','stroke-dasharray':'3,6'})));
  [dsTop+DSH,dsTop+DSH+RH].forEach(y=>
    bg.appendChild(mk('line',{x1:LW,y1:y,x2:W,y2:y,stroke:'#282826','stroke-width':'0.5'})));
  for(let i=0;i<=COLS;i++)
    bg.appendChild(mk('line',{x1:LW+i*CW,y1:TH,x2:LW+i*CW,y2:H-10,stroke:'#282826','stroke-width':'0.5'}));
  bg.appendChild(mk('line',{x1:LW,y1:0,x2:LW,y2:H,stroke:'#323230','stroke-width':'0.5'}));
  sv.appendChild(bg);

  // Column headers
  const hg=mk('g');
  for(let g=1;g<=10;g++)
    hg.appendChild(tx(g,{x:gx(g),y:TH-10,'text-anchor':'middle','dominant-baseline':'central',
      'font-size':'11','font-family':FONT,fill:'#484844'}));
  hg.appendChild(tx('класс →',{x:LW/2,y:TH-10,'text-anchor':'middle','dominant-baseline':'central',
    'font-size':'9','font-family':FONT,fill:'#404040'}));
  sv.appendChild(hg);

  // Row labels
  const lg=mk('g');
  function lbl(lines,yc){
    const lh=13,n=lines.length;
    lines.forEach((s,i)=>lg.appendChild(tx(s,{
      x:LW-8,y:yc-(n-1)*lh/2+i*lh,'text-anchor':'end','dominant-baseline':'central',
      'font-size':'11','font-weight':'500','font-family':FONT,fill:'#787870'})));
  }
  lbl(['Робото-','техника'],Y.rb);
  lbl(['Техно-','мейкерство'],Y.tm);
  lbl(['Програм-','мирование'],Y.pr);
  lbl(['Геймдев'],Y.gd);
  lbl(['IT-English'],Y.en);
  lbl(['Computer','Science'],Y.cs);
  lbl(['Дизайн'],dsTop+DSH/2);
  lbl(['Web-','технологии'],Y.wb);
  sv.appendChild(lg);

  // Edges
  function edge(fid,tid,cross){
    const a=NM[fid],b=NM[tid];if(!a||!b)return null;
    const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d,e=0.001;
    const ts=Math.min(a.w/2/Math.max(Math.abs(ux),e),(NH/2)/Math.max(Math.abs(uy),e));
    const te=Math.min((b.w/2+1)/Math.max(Math.abs(ux),e),((NH/2)+1)/Math.max(Math.abs(uy),e));
    const x1=a.x+ux*ts,y1=a.y+uy*ts,x2=b.x-ux*te,y2=b.y-uy*te;
    const col=cross?'rgba(160,165,190,0.22)':a.c.s;
    const mid=cross?'am-x':('am-'+(a.ck||a.r));
    const at={x1,y1,x2,y2,stroke:col,'stroke-width':cross?'1':'1.6','marker-end':`url(#${mid})`};
    if(cross)at['stroke-dasharray']='4,3';
    return mk('line',at);
  }

  const cg=mk('g');CROSS.forEach(([f,t])=>{const l=edge(f,t,true);if(l)cg.appendChild(l);});sv.appendChild(cg);
  const mg=mk('g');MAIN.forEach(([f,t])=>{const l=edge(f,t,false);if(l)mg.appendChild(l);});sv.appendChild(mg);

  // Nodes
  const ng=mk('g');
  NODES.forEach(n=>{
    ng.appendChild(mk('rect',{x:n.x-n.w/2,y:n.y-NH/2,width:n.w,height:NH,rx:'4',
      fill:n.c.f,stroke:n.c.s,'stroke-width':'1.2'}));
    ng.appendChild(tx(n.lb,{x:n.x,y:n.y,'text-anchor':'middle','dominant-baseline':'central',
      'font-size':'9.5','font-weight':'600','font-family':FONT,fill:n.c.t}));
  });
  sv.appendChild(ng);

  // Legend
  const lY=H-3,lX=LW+4;
  sv.appendChild(mk('line',{x1:lX,y1:lY,x2:lX+22,y2:lY,stroke:'#3aaed8','stroke-width':'1.6','marker-end':'url(#am-rb)'}));
  sv.appendChild(tx('основная прогрессия',{x:lX+26,y:lY,'dominant-baseline':'central','font-size':'9','font-family':FONT,fill:'#484844'}));
  sv.appendChild(mk('line',{x1:lX+122,y1:lY,x2:lX+144,y2:lY,stroke:'rgba(160,165,190,0.4)','stroke-width':'1','stroke-dasharray':'4,3','marker-end':'url(#am-x)'}));
  sv.appendChild(tx('переход между направлениями',{x:lX+148,y:lY,'dominant-baseline':'central','font-size':'9','font-family':FONT,fill:'#484844'}));
})();
</script>
</body>
</html>
